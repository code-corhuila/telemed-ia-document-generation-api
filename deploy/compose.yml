# Document Generation API service. telemed-ia-infra-postgres includes this file
# in the platform composition root (Anexo G).
# The service declares `expose`, not `ports`: only the API Gateway is
# published to the host (Anexo G, numeral 5.6.1).
services:
  document-generation-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: telemed-ia/document-generation-api:dev
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      # Public key of the identity service (numeral 5.3.7). The service does not
      # start without it.
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}"
      # Shared PostgreSQL instance (Anexo J), with the domain's application user.
      DB_URL: "jdbc:postgresql://postgres:5432/${PG_DATABASE:-telemed_ia}"
      DB_USER: "${DOCUMENT_GENERATION_APP_USER:-document_generation_app}"
      DB_PASSWORD: "${DOCUMENT_GENERATION_APP_PASSWORD:?DOCUMENT_GENERATION_APP_PASSWORD is required}"
      # Object storage of the PDFs (ADR-015, ADR-021): the object-storage service of
      # telemed-ia-infra-postgres. Credentials come from infra secrets.
      STORAGE_ENDPOINT: "${STORAGE_ENDPOINT:-http://object-storage:9000}"
      # The browser downloads from here, so URLs are signed for it.
      STORAGE_PUBLIC_ENDPOINT: "${STORAGE_PUBLIC_ENDPOINT:-http://localhost:${STORAGE_HOST_PORT:-9000}}"
      STORAGE_ACCESS_KEY: "${STORAGE_ROOT_USER:?STORAGE_ROOT_USER is required}"
      STORAGE_SECRET_KEY: "${STORAGE_ROOT_PASSWORD:?STORAGE_ROOT_PASSWORD is required}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-telemed-documents}"
      STORAGE_REGION: "${STORAGE_REGION:-us-east-1}"
      STORAGE_PRESIGNED_TTL_SECONDS: "${STORAGE_PRESIGNED_TTL_SECONDS:-300}"
      # Medical Consultation, read through its API inside the platform network
      # (DEC-006): service and port of telemed-ia-medical-consultation-api.
      CONSULTATION_BASE_URL: "${CONSULTATION_BASE_URL:-http://medical-consultation-api:8080}"
      # Service token from the identity service (norma 5.7, identity-and-access-api
      # #117): service identity-api, port 8081, reachable only inside the platform network.
      IDENTITY_URL: "${IDENTITY_URL:-http://identity-api:8081}"
      SERVICE_CLIENT_ID: "${DOCUMENT_GENERATION_SERVICE_CLIENT_ID:-document-generation}"
      # Delivered privately by the identity owner; lives only in env/<environment>.env.
      SERVICE_CLIENT_SECRET: "${DOCUMENT_GENERATION_SERVICE_CLIENT_SECRET:-}"
    expose:
      - "8080"
    networks:
      - platform

networks:
  platform:
    external: true
    name: platform
