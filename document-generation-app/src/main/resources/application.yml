# Composition root configuration.
# Numeral 5.3.10: every limit is declared here with its value. A default that is
# not written down is not a decision.
spring:
  application:
    name: document-generation-api
  lifecycle:
    # Graceful shutdown budget.
    timeout-per-shutdown-phase: 20s
  datasource:
    # Anexo J: the shared instance, with the domain's own application user
    # (never the administrator). DB_URL and DB_PASSWORD are required.
    url: ${DB_URL}
    username: ${DB_USER:document_generation_app}
    password: ${DB_PASSWORD}
    hikari:
      # Pool size.
      maximum-pool-size: 10
      # Maximum wait for a free connection, in milliseconds.
      connection-timeout: 5000
      # Maximum time per statement.
      connection-init-sql: SET statement_timeout = '5s'

# ADR-015, ADR-021: PDFs live in S3-compatible object storage (RustFS) and are
# downloaded through presigned URLs.
# STORAGE_ENDPOINT, STORAGE_ACCESS_KEY and STORAGE_SECRET_KEY are required.
storage:
  # Internal endpoint, for storage operations.
  endpoint: ${STORAGE_ENDPOINT}
  # Endpoint the browser reaches; download URLs are signed for it (ADR-021).
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:${STORAGE_ENDPOINT}}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  bucket: ${STORAGE_BUCKET:telemed-documents}
  # Fixed region: presigned URLs are then signed without asking the server.
  region: ${STORAGE_REGION:us-east-1}
  # Validity of a download URL (5 minutes).
  presigned-ttl-seconds: ${STORAGE_PRESIGNED_TTL_SECONDS:300}

# DEC-005, DEC-006: PDF generation runs in the background inside this service.
generation:
  # Services allowed to request a generation with their own token (DEC-007, ADR-022):
  # client ids, comma separated. The consumer of PostConsultationSummaryGenerated.
  service-clients: ${GENERATION_SERVICE_CLIENTS:worker}
  # Off only in tests that never generate a PDF.
  background-enabled: ${GENERATION_BACKGROUND_ENABLED:true}
  # Time limit of one attempt (DEC-005).
  attempt-timeout-seconds: 30
  # Threads that run attempts; they share the machine with the HTTP requests.
  executor-threads: 2
  # Documents queued or waiting for a retry; beyond that the resume sweep picks them up.
  max-in-flight: 100
  # Sweep for PENDING, GENERATING and retryable ERROR documents: at startup and then
  # every interval, at most one batch per run.
  resume-interval-seconds: 60
  resume-batch-size: 50
  # Wait before a retry: full jitter over base * 2^n, capped (norma 5.7.2).
  retry-backoff-base-ms: 5000
  retry-backoff-cap-ms: 60000
  # Time zone of the issue date printed on the PDF.
  time-zone: America/Bogota

# DEC-006: the summary is read from Medical Consultation through its API.
# CONSULTATION_BASE_URL is required.
consultation:
  base-url: ${CONSULTATION_BASE_URL}
  # Time limit of each request, connection included.
  request-timeout-ms: 5000
  # Attempts per request; only network errors, 429 and 5xx are retried (norma 5.7.2).
  max-attempts: 3
  backoff-base-ms: 200
  backoff-cap-ms: 2000

# Norma 5.7: the service token is issued by the identity service (identity-and-access-api
# #117) at POST /internal/service-token, inside the platform network only.
# IDENTITY_URL is required. SERVICE_CLIENT_SECRET is never versioned; without it,
# calls go without a token and Medical Consultation rejects them.
identity:
  base-url: ${IDENTITY_URL}
  client-id: ${SERVICE_CLIENT_ID:document-generation}
  client-secret: ${SERVICE_CLIENT_SECRET:}
  # Time limit of the token request, connection included.
  request-timeout-ms: 5000
  # Tokens last about ten minutes and have no refresh token: replaced this long before.
  refresh-margin-seconds: 60

# ADR-011, DEC-008, DEC-009: the outbox is published to RabbitMQ (exchange documents.events),
# with the common event contract of 09-microservices/communication-patterns.md (2.1).
# The password comes from the environment, never from this file.
events:
  # Off only where there is no broker.
  publishing-enabled: ${EVENTS_PUBLISHING_ENABLED:true}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
  # Pause between rounds, and events per round.
  publish-interval-ms: 5000
  batch-size: 50
  # Wait for the broker's confirmation of each event, and for the connection.
  confirm-timeout-ms: 5000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # Maximum time to receive the request headers.
    connection-timeout: 5s
    # Idle keep-alive connections are closed after this time.
    keep-alive-timeout: 60s
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

# NFR-005: metrics for the Prometheus of telemed-ia-infra-postgres. They are served on
# their own port, inside the platform network only: never published, never routed by
# the gateway, so the scrape needs no token. The same port carries the pause switch of
# PDF generation (OBS-DG-06, /actuator/generation).
management:
  server:
    port: ${MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,prometheus,generation
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets of the HTTP latency SLI (week 11 workshop).
      slo:
        http.server.requests: 100ms,500ms,1s,2s,5s
  # OBS-DG-02: one trace per request across services (W3C traceparent in and out). The
  # volume is low, so every request is kept; spans go to the platform OpenTelemetry
  # collector of telemed-ia-infra-postgres.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}

# Numeral 5.3.9: every log line is JSON and carries the request's correlationId, and
# traceId and spanId while a span is open (OBS-DG-02).
logging:
  structured:
    format:
      console: ecs
