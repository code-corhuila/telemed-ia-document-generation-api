# Composition root configuration.
# Numeral 5.3.10: every limit is declared here with its value. A default that is
# not written down is not a decision.
spring:
  application:
    name: document-generation-api
  lifecycle:
    # Graceful shutdown budget.
    timeout-per-shutdown-phase: 20s
  datasource:
    # Anexo J: the shared instance, with the domain's own application user
    # (never the administrator). DB_URL and DB_PASSWORD are required.
    url: ${DB_URL}
    username: ${DB_USER:document_generation_app}
    password: ${DB_PASSWORD}
    hikari:
      # Pool size.
      maximum-pool-size: 10
      # Maximum wait for a free connection, in milliseconds.
      connection-timeout: 5000
      # Maximum time per statement.
      connection-init-sql: SET statement_timeout = '5s'

# ADR-015, ADR-021: PDFs live in S3-compatible object storage (RustFS) and are
# downloaded through presigned URLs.
# STORAGE_ENDPOINT, STORAGE_ACCESS_KEY and STORAGE_SECRET_KEY are required.
storage:
  # Internal endpoint, for storage operations.
  endpoint: ${STORAGE_ENDPOINT}
  # Endpoint the browser reaches; download URLs are signed for it (ADR-021).
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:${STORAGE_ENDPOINT}}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  bucket: ${STORAGE_BUCKET:telemed-documents}
  # Fixed region: presigned URLs are then signed without asking the server.
  region: ${STORAGE_REGION:us-east-1}
  # Validity of a download URL (5 minutes).
  presigned-ttl-seconds: ${STORAGE_PRESIGNED_TTL_SECONDS:300}

# DEC-005, DEC-006: PDF generation runs in the background inside this service.
generation:
  # Off only in tests that never generate a PDF.
  background-enabled: ${GENERATION_BACKGROUND_ENABLED:true}
  # Time limit of one attempt (DEC-005).
  attempt-timeout-seconds: 30
  # Threads that run attempts; they share the machine with the HTTP requests.
  executor-threads: 2
  # Documents queued or waiting for a retry; beyond that the resume sweep picks them up.
  max-in-flight: 100
  # Sweep for PENDING, GENERATING and retryable ERROR documents: at startup and then
  # every interval, at most one batch per run.
  resume-interval-seconds: 60
  resume-batch-size: 50
  # Wait before a retry: full jitter over base * 2^n, capped (norma 5.7.2).
  retry-backoff-base-ms: 5000
  retry-backoff-cap-ms: 60000
  # Time zone of the issue date printed on the PDF.
  time-zone: America/Bogota

# DEC-006: the summary is read from Medical Consultation through its API.
# CONSULTATION_BASE_URL is required. CONSULTATION_SERVICE_TOKEN is issued by the
# identity service and never versioned (norma 5.7).
consultation:
  base-url: ${CONSULTATION_BASE_URL}
  service-token: ${CONSULTATION_SERVICE_TOKEN:}
  # Time limit of each request, connection included.
  request-timeout-ms: 5000
  # Attempts per request; only network errors, 429 and 5xx are retried (norma 5.7.2).
  max-attempts: 3
  backoff-base-ms: 200
  backoff-cap-ms: 2000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # Maximum time to receive the request headers.
    connection-timeout: 5s
    # Idle keep-alive connections are closed after this time.
    keep-alive-timeout: 60s
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

# Numeral 5.3.9: every log line is JSON and carries the request's correlationId.
logging:
  structured:
    format:
      console: ecs
